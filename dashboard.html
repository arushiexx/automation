<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>WhatsApp Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font-family:'Inter',sans-serif;background:#111b21;color:#e9edef;height:100%;touch-action:manipulation}

/* LOGIN */
#loginScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0a1014,#1a2a33)}
.login-box{background:#1f2c34;padding:32px;border-radius:12px;text-align:center;width:90%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login-box h2{color:#00a884;margin-bottom:8px;font-size:20px}
.login-box p{color:#8696a0;font-size:13px;margin-bottom:20px}
.login-box input{width:100%;padding:14px 16px;background:#2a3942;border:1px solid #374045;border-radius:8px;color:#e9edef;font-size:18px;outline:none;margin-bottom:16px;text-align:center;letter-spacing:8px}
.login-box input:focus{border-color:#00a884}
.login-box button{width:100%;padding:14px;background:#00a884;color:#fff;border:none;border-radius:8px;font-size:16px;font-weight:600;cursor:pointer}
.login-box button:active{background:#008f72}
.login-error{color:#ea4335;font-size:13px;margin-top:8px;display:none}

/* SCREENS */
#app{display:none;height:100%;width:100%;position:relative}

/* SCREEN 1: CONTACT LIST */
#contactScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;background:#111b21;z-index:10}
.screen-header{padding:10px 16px;background:#1f2c34;display:flex;align-items:center;min-height:54px;gap:12px}
.screen-header h3{flex:1;font-size:18px;font-weight:600}
.hdr-btn{background:none;border:none;color:#8696a0;cursor:pointer;font-size:20px;padding:8px;border-radius:50%;width:40px;height:40px;display:flex;align-items:center;justify-content:center}
.hdr-btn:active{background:#2a3942}
.search-box{padding:8px 12px;background:#111b21}
.search-box input{width:100%;padding:10px 14px;background:#2a3942;border:none;border-radius:8px;color:#e9edef;font-size:15px;outline:none}
.contact-list{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.contact-list::-webkit-scrollbar{width:4px}
.contact-list::-webkit-scrollbar-thumb{background:#374045;border-radius:4px}
.contact-item{display:flex;align-items:center;padding:14px 16px;cursor:pointer;border-bottom:1px solid #222d34}
.contact-item:active{background:#2a3942}
.contact-item.active{background:#2a3942}
.c-avatar{width:48px;height:48px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;color:#fff;margin-right:14px;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-last{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.c-time{font-size:11px;color:#8696a0;white-space:nowrap;align-self:flex-start;margin-top:4px}
.no-chats{text-align:center;padding:60px 20px;color:#8696a0;font-size:15px}

/* SCREEN 2: CHAT */
#chatScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;background:#0b141a;z-index:20}
#chatScreen.open{display:flex}
.chat-hdr{padding:8px 8px 8px 4px;background:#1f2c34;display:flex;align-items:center;min-height:54px;gap:4px}
.chat-hdr .back-btn{background:none;border:none;color:#e9edef;font-size:22px;padding:8px 4px 8px 8px;cursor:pointer;display:flex;align-items:center}
.chat-hdr .ch-avatar{width:36px;height:36px;border-radius:50%;background:#00a884;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:#fff;margin-right:8px;flex-shrink:0}
.chat-hdr .ch-info{flex:1;min-width:0}
.chat-hdr .ch-name{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-hdr .ch-phone{font-size:12px;color:#8696a0}
.chat-hdr .del-btn{background:none;border:none;color:#ea4335;font-size:18px;padding:8px;cursor:pointer}
.messages-area{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.messages-area::-webkit-scrollbar{width:4px}
.messages-area::-webkit-scrollbar-thumb{background:#374045;border-radius:4px}
.msg-bubble{max-width:82%;padding:7px 10px;margin-bottom:3px;border-radius:8px;font-size:14px;line-height:1.4;word-wrap:break-word;clear:both}
.msg-in{background:#1f2c34;float:left;border-top-left-radius:0}
.msg-out{background:#005c4b;float:right;border-top-right-radius:0}
.msg-time{font-size:10px;color:rgba(255,255,255,.45);text-align:right;margin-top:3px}
.msg-day{clear:both;text-align:center;margin:12px 0}
.msg-day span{background:#1a2730;color:#8696a0;padding:4px 12px;border-radius:6px;font-size:12px}
.input-bar{padding:6px 8px;background:#1f2c34;display:flex;align-items:center;gap:6px}
.input-bar input{flex:1;padding:12px 14px;background:#2a3942;border:none;border-radius:24px;color:#e9edef;font-size:15px;outline:none}
.input-bar button{width:44px;height:44px;background:#00a884;color:#fff;border:none;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.input-bar button.attach-btn{background:transparent;color:#8696a0;font-size:22px}
.input-bar button:active{background:#008f72}

/* SCREEN 3: SETTINGS */
#settingsScreen{position:absolute;top:0;left:0;width:100%;height:100%;display:none;flex-direction:column;background:#111b21;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch}
#settingsScreen.open{display:flex}
.settings-hdr{padding:10px 16px;background:#1f2c34;display:flex;align-items:center;min-height:54px;gap:12px;position:sticky;top:0;z-index:5}
.settings-hdr h3{flex:1;font-size:18px}
.settings-section{padding:20px 16px;border-bottom:1px solid #222d34}
.settings-section h4{color:#00a884;font-size:13px;margin-bottom:14px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
.settings-section label{display:block;color:#8696a0;font-size:13px;margin-bottom:6px}
.s-input{width:100%;padding:12px;background:#2a3942;border:1px solid #374045;border-radius:8px;color:#e9edef;font-size:15px;outline:none}
.s-input:focus{border-color:#00a884}
textarea.s-input{min-height:120px;resize:vertical;font-family:'Inter',sans-serif}
.s-btn{padding:12px 24px;background:#00a884;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;width:100%}
.s-btn:active{background:#008f72}
.s-file{margin-top:8px;color:#8696a0;font-size:14px}
.dp-preview{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#2a3942;display:block;margin:10px auto}
.status-msg{padding:10px;border-radius:6px;font-size:13px;margin-top:8px;display:none;text-align:center}
.status-msg.success{display:block;background:rgba(0,168,132,.15);color:#00a884}
.status-msg.error{display:block;background:rgba(234,67,53,.15);color:#ea4335}

/* CROP MODAL */
#cropModal{display:none;position:fixed;top:0;left:0;width:100%;height:100vh;background:rgba(0,0,0,.95);z-index:100;flex-direction:column;align-items:center;justify-content:center}
#cropModal.open{display:flex}
.crop-box{width:92%;max-width:500px;max-height:65vh}
.crop-box img{max-width:100%;display:block}
.crop-btns{margin-top:20px;display:flex;gap:16px}
.crop-btns button{padding:12px 28px;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
.crop-btns .crop-cancel{background:#2a3942;color:#e9edef}
.crop-btns .crop-apply{background:#00a884;color:#fff}

/* DESKTOP: side by side */
@media(min-width:769px){
#contactScreen{width:360px;border-right:1px solid #222d34}
#chatScreen{left:360px;width:calc(100% - 360px);display:flex !important;z-index:10}
#chatScreen .back-btn{display:none !important}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#8696a0}
.empty-state .big-icon{font-size:72px;opacity:.3;margin-bottom:16px}
.empty-state h3{font-size:22px;font-weight:300;color:#e9edef;margin-bottom:6px}
#settingsScreen{left:360px;width:calc(100% - 360px)}
}
/* CONTEXT MENU */
#contextMenu {
  display: none;
  position: fixed;
  z-index: 10000;
  background: #233138;
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  padding: 6px 0;
  min-width: 190px;
  border: 1px solid #2a3942;
}
.menu-item {
  padding: 10px 16px;
  font-size: 14px;
  color: #e9edef;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.15s ease;
  user-select: none;
}
.menu-item:hover, .menu-item:active {
  background: #182229;
}
.menu-item.danger {
  color: #ea4335;
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
<div class="login-box">
<h2>WhatsApp Dashboard</h2>
<p>Enter your 4-digit PIN</p>
<input type="password" id="loginPass" placeholder="****" maxlength="4" inputmode="numeric" onkeypress="if(event.key==='Enter')doLogin()">
<button onclick="doLogin()">Login</button>
<div class="login-error" id="loginErr">Wrong PIN</div>
</div>
</div>

<!-- MAIN APP -->
<div id="app">

<!-- SCREEN 1: CONTACTS -->
<div id="contactScreen">
<div class="screen-header">
<h3>Chats</h3>
<button class="hdr-btn" onclick="openSettings()" title="Settings">&#9881;</button>
<button class="hdr-btn" onclick="loadConversations()" title="Refresh">&#8635;</button>
</div>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search contacts..." oninput="filterContacts()">
</div>
<div class="contact-list" id="contactList">
<div class="no-chats">Loading...</div>
</div>
</div>

<!-- SCREEN 2: CHAT -->
<div id="chatScreen">
<div id="chatContent" style="display:none;flex-direction:column;height:100%;position:relative;">
<div class="chat-hdr">
<button class="back-btn" onclick="goBackToLobby()">&#8592;</button>
<div class="ch-avatar" id="chatAvatar">?</div>
<div class="ch-info">
<div class="ch-name" id="chatName">Name</div>
<div class="ch-phone" id="chatPhone">+91...</div>
</div>
<button class="del-btn" onclick="deleteChat()" title="Delete">&#128465;</button>
</div>
<div class="messages-area" id="messagesArea"></div>
<!-- REPLY PREVIEW BAR -->
<div id="replyPreviewBar" style="display:none; padding:8px 12px; background:#1f2c34; border-left:4px solid #00a884; border-radius:6px; margin:4px 8px 0 8px; position:relative; flex-shrink:0;">
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span style="color:#00a884; font-size:12px; font-weight:600;" id="replySender">Replying to Customer</span>
    <button onclick="cancelReply()" style="background:none; border:none; color:#8696a0; font-size:16px; cursor:pointer; padding:0 4px;">✕</button>
  </div>
  <div id="replyPreviewText" style="color:#8696a0; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;">Quoted message</div>
</div>
<div class="input-bar">
<button class="attach-btn" onclick="document.getElementById('mediaFile').click()" title="Attach Photo/Video">&#128206;</button>
<button id="viewOnceBtn" onclick="toggleViewOnce()" class="attach-btn" title="Toggle View-Once Mode" style="font-size:12px; font-weight:700; color:#8696a0; border:1px solid #374045; border-radius:14px; padding:3px 8px; background:transparent;">1️⃣ Off</button>
<input type="file" id="mediaFile" accept="image/*,video/*" style="display:none" onchange="sendMedia(event)">
<input type="text" id="msgInput" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendMsg()">
<button onclick="sendMsg()">&#10148;</button>
</div>
</div>
<div class="empty-state" id="emptyState">
<div class="big-icon">&#128172;</div>
<h3>WhatsApp Dashboard</h3>
<p>Select a chat to start messaging</p>
</div>
</div>

<!-- SCREEN 3: SETTINGS -->
<div id="settingsScreen">
<div class="settings-hdr">
<button class="hdr-btn" onclick="closeSettings()">&#8592;</button>
<h3>Settings</h3>
</div>
<div class="settings-section">
<h4>Profile Picture</h4>
<img id="dpPreview" class="dp-preview" src="" alt="DP">
<input type="file" id="dpFile" accept="image/jpeg,image/png" class="s-file" style="display:none" onchange="openCropModal(event)">
<button class="s-btn" onclick="document.getElementById('dpFile').click()">Change DP</button>
<div class="status-msg" id="dpStatus"></div>
</div>
<div class="settings-section">
<h4>Profile Info</h4>
<label>About</label>
<input type="text" id="profileAbout" class="s-input" placeholder="Hey there!">
<label style="margin-top:10px">Description</label>
<textarea id="profileDesc" class="s-input" placeholder="Business description..."></textarea>
<button class="s-btn" onclick="updateProfile()">Save Profile</button>
<div class="status-msg" id="profileStatus"></div>
</div>
<div class="settings-section">
<h4>Auto-Reply Message</h4>
<textarea id="autoReplyMsg" class="s-input" placeholder="Auto reply message..."></textarea>
<button class="s-btn" onclick="updateAutoReply()">Save Auto-Reply</button>
<div class="status-msg" id="arStatus"></div>
</div>
</div>

<!-- CROP MODAL -->
<div id="cropModal">
<div class="crop-box">
<img id="cropImage" src="">
</div>
<div class="crop-btns">
<button class="crop-cancel" onclick="closeCrop()">Cancel</button>
<button class="crop-apply" onclick="applyCrop()">Upload</button>
</div>
</div>

<!-- WHATSAPP WEB CONTEXT MENU -->
<div id="contextMenu">
  <div class="menu-item" onclick="onMenuReply()"><span style="font-size:16px;">↩️</span> Reply</div>
  <div class="menu-item" onclick="onMenuCopy()"><span style="font-size:16px;">📋</span> Copy text</div>
  <div class="menu-item danger" onclick="onMenuDeleteForEveryone()"><span style="font-size:16px;">🗑️</span> Delete for everyone</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
<script>
var TOKEN="";
var currentPhone="";
var conversations=[];
var pollInterval=null;
var cropper=null;
var isMobile=window.innerWidth<=768;

// Prevent browser back from leaving
history.pushState(null,null,location.href);
window.addEventListener("popstate",function(){
  history.pushState(null,null,location.href);
  if(document.getElementById("cropModal").classList.contains("open")){
    closeCrop();
  } else if(document.getElementById("settingsScreen").classList.contains("open")){
    closeSettings();
  } else if(currentPhone && isMobile){
    goBackToLobby();
  }
});

window.addEventListener("resize",function(){isMobile=window.innerWidth<=768});

function doLogin(){
var pass=document.getElementById("loginPass").value;
TOKEN=pass;
fetch("/api/conversations?token="+pass)
.then(function(r){if(!r.ok)throw new Error();return r.json()})
.then(function(){
document.getElementById("loginScreen").style.display="none";
document.getElementById("app").style.display="block";
loadConversations();
loadProfile();
loadAutoReply();
pollInterval=setInterval(function(){
loadConversations();
if(currentPhone)loadMessages(currentPhone,true);
},3000);
})
.catch(function(){
document.getElementById("loginErr").style.display="block";
setTimeout(function(){document.getElementById("loginErr").style.display="none"},2000);
});
}

function api(url,opts){
opts=opts||{};
opts.headers=Object.assign({},opts.headers,{"x-auth-token":TOKEN});
return fetch(url,opts);
}

function loadConversations(){
api("/api/conversations").then(function(r){return r.json()}).then(function(data){
conversations=data;
renderContacts(data);
});
}

var avatarColors = [
  "linear-gradient(135deg, #00a884, #005c4b)",
  "linear-gradient(135deg, #34b7f1, #128c7e)",
  "linear-gradient(135deg, #e91e63, #ad1457)",
  "linear-gradient(135deg, #9c27b0, #6a1b9a)",
  "linear-gradient(135deg, #ff9800, #e65100)",
  "linear-gradient(135deg, #4caf50, #2e7d32)"
];

function getAvatarColor(phone) {
  var num = 0;
  for (var i = 0; i < (phone || "").length; i++) {
    num += phone.charCodeAt(i);
  }
  return avatarColors[num % avatarColors.length];
}

function formatPhone(phone) {
  if (!phone) return "";
  var clean = phone.replace(/\D/g, "");
  if (clean.length === 12 && clean.startsWith("91")) {
    return "+91 " + clean.substring(2, 7) + " " + clean.substring(7);
  }
  if (clean.length === 10) {
    return "+91 " + clean.substring(0, 5) + " " + clean.substring(5);
  }
  return "+" + clean;
}

function renderContacts(data){
var el=document.getElementById("contactList");
if(!data||!data.length){el.innerHTML='<div class="no-chats">No conversations yet</div>';return;}
var search=document.getElementById("searchInput").value.toLowerCase();
var filtered=search?data.filter(function(c){return(c.name||"").toLowerCase().indexOf(search)>-1||c.phone.indexOf(search)>-1}):data;
var html="";
for(var i=0;i<filtered.length;i++){
var c=filtered[i];
var formattedPhone = formatPhone(c.phone);
var displayName = (c.name && c.name !== "Unknown") ? c.name : formattedPhone;
var subTitle = (c.name && c.name !== "Unknown") ? formattedPhone : "";
var avatarBg = getAvatarColor(c.phone);
var initials = (displayName || "?")[0].toUpperCase();

var time=c.lastTime?new Date(c.lastTime).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}):"";
var active=c.phone===currentPhone?"active":"";
var lastMsg=(c.lastMessage||"").length>35?c.lastMessage.substring(0,35)+"...":c.lastMessage||"";
var safeName=(c.name||"").replace(/'/g,"\\'").replace(/"/g,"&quot;");

html+='<div class="contact-item '+active+'" onclick="openChat(\''+c.phone+"','"+safeName+"')\">";
html+='<div class="c-avatar" style="background:' + avatarBg + '; font-weight:700; box-shadow:0 2px 8px rgba(0,0,0,0.3);">'+initials+'</div>';
html+='<div class="c-info">';
html+='<div class="c-name" style="font-weight:600; font-size:15px;">'+displayName+'</div>';
if (subTitle) {
  html+='<div class="c-phone-sub" style="font-size:12px; color:#8696a0; margin-top:1px;">' + subTitle + '</div>';
}
html+='<div class="c-last">'+lastMsg+'</div>';
html+='</div>';
html+='<span class="c-time">'+time+'</span>';
html+='</div>';
}
el.innerHTML=html;
}

function filterContacts(){renderContacts(conversations)}

function openChat(phone,name){
currentPhone=phone;
document.getElementById("chatContent").style.display="flex";
if(document.getElementById("emptyState"))document.getElementById("emptyState").style.display="none";

var formattedPhone = formatPhone(phone);
var displayName = (name && name !== "Unknown") ? name : formattedPhone;
var avatarBg = getAvatarColor(phone);
var initials = (displayName || "?")[0].toUpperCase();

document.getElementById("chatName").textContent=displayName;
document.getElementById("chatPhone").textContent=(name && name !== "Unknown") ? formattedPhone : "";
document.getElementById("chatAvatar").textContent=initials;
document.getElementById("chatAvatar").style.background=avatarBg;

if(isMobile){
document.getElementById("chatScreen").classList.add("open");
}
loadMessages(phone);
renderContacts(conversations);
}

function goBackToLobby(){
if(isMobile){
document.getElementById("chatScreen").classList.remove("open");
}
currentPhone="";
renderContacts(conversations);
}

function loadMessages(phone,silent){
api("/api/messages/"+phone).then(function(r){return r.json()}).then(function(data){
var el=document.getElementById("messagesArea");
var wasAtBottom=el.scrollHeight-el.scrollTop-el.clientHeight<100;
var html="";
var lastDay="";
var msgs=data.msgs||[];
var contactName = data.name || "Customer";
for(var i=0;i<msgs.length;i++){
var m=msgs[i];
var d=new Date(m.ts);
var day=d.toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
if(day!==lastDay){html+='<div class="msg-day"><span>'+day+'</span></div>';lastDay=day;}
var time=d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"});
var cls=m.dir==="in"?"msg-in":"msg-out";
var senderName = m.dir==="in" ? contactName : "You";

var quotedHtml = "";
if (m.quoted && (m.quoted.text || m.quoted.name)) {
  var qName = (m.quoted.name || "User").replace(/'/g, "\\'");
  var qText = (m.quoted.text || "").replace(/'/g, "\\'");
  quotedHtml = '<div style="border-left:3px solid #00a884; background:rgba(0,0,0,0.25); padding:4px 8px; border-radius:4px; margin-bottom:4px; font-size:12px; cursor:pointer;" onclick="setReplyTarget(\'' + qName + '\', \'' + qText + '\', \'\')">' +
                 '<div style="color:#00a884; font-weight:600; font-size:11px;">' + (m.quoted.name || 'Quoted') + '</div>' +
                 '<div style="color:#8696a0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">' + (m.quoted.text || '') + '</div>' +
               '</div>';
}

var statusTick = "";
if (m.dir === "out") {
  if (m.status === "read") {
    statusTick = '<span style="color:#53bdeb; margin-left:4px; font-weight:bold; font-size:12px;" title="Read">✓✓</span>';
  } else if (m.status === "delivered") {
    statusTick = '<span style="color:#8696a0; margin-left:4px; font-weight:bold; font-size:12px;" title="Delivered">✓✓</span>';
  } else {
    statusTick = '<span style="color:#8696a0; margin-left:4px; font-weight:bold; font-size:12px;" title="Sent">✓</span>';
  }
}

var content = m.text.replace(/\n/g,"<br>");
if (m.text === "[DELETED_FOR_EVERYONE]") {
  content = '<div style="padding:4px 8px; color:#8696a0; font-size:13px; font-style:italic; display:inline-flex; align-items:center; gap:6px;">' +
              '<span>🚫</span>' +
              '<span>This message was deleted</span>' +
            '</div>';
} else if (m.text === "[EXPIRED_IMAGE]") {
  content = '<div style="padding:6px 10px; background:rgba(255,255,255,0.06); border-radius:6px; color:#8696a0; font-size:12px; display:inline-flex; align-items:center; gap:6px;">' +
              '<span style="font-size:14px;">🔒</span>' +
              '<span>Photo Viewed (Expired)</span>' +
            '</div>';
} else if (m.text.startsWith("[IMAGE:")) {
  var mediaId = m.text.substring(7, m.text.length-1);
  var mediaSrc = '/api/media/' + mediaId + '?token=' + TOKEN;
  var safeMsgId = (m.id || '').replace(/'/g, "\\'");
  content = '<div class="media-blur-box" onclick="revealMedia(this, \'' + phone + '\', \'' + safeMsgId + '\', \'' + mediaId + '\')" style="position:relative;overflow:hidden;border-radius:8px;margin-bottom:4px;cursor:pointer;max-width:260px;">' +
              '<img src="' + mediaSrc + '" class="media-img" style="filter:blur(22px);transition:filter 0.3s ease;width:100%;display:block;pointer-events:none;">' +
              '<div class="media-overlay" style="position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,0.5);color:#fff;font-size:12px;text-align:center;padding:8px;">' +
                '<span style="font-size:22px;margin-bottom:2px;">👁️</span>' +
                '<span style="font-weight:600;">Click to Reveal Image</span>' +
                '<span style="font-size:10px;opacity:0.75;margin-top:2px;">Expires 1 min after view</span>' +
              '</div>' +
            '</div>';
} else if (m.text.startsWith("[OUT_VIEW_ONCE_MEDIA:")) {
  if (m.status === "read") {
    content = '<div style="padding:6px 12px; background:rgba(0,168,132,0.12); border-radius:8px; color:#00a884; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;"><span>🔒</span> <span>Opened (View Once Media Expired)</span></div>';
  } else {
    content = '<div style="padding:6px 12px; background:rgba(0,168,132,0.2); border-radius:8px; color:#00a884; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:6px;"><span>1️⃣</span> <span>View Once Photo/Video (Sent)</span></div>';
  }
} else if (m.text.startsWith("[OUT_IMAGE_MEDIA:")) {
  var mediaId = m.text.substring(17, m.text.length-1);
  content = '<img src="/api/media/' + mediaId + '?token=' + TOKEN + '" style="max-width:100%;border-radius:8px;margin-bottom:4px;display:block">';
} else if (m.text.startsWith("[OUT_IMAGE:")) {
  var url = m.text.substring(11, m.text.length-1);
  content = '<img src="' + url + '" style="max-width:100%;border-radius:8px;margin-bottom:4px;display:block">';
}

var cleanText = m.text.startsWith("[IMAGE:") ? "Photo" : m.text.replace(/'/g, "\\'").replace(/\n/g, " ");
var safeSender = senderName.replace(/'/g, "\\'");
var safeMsgId = (m.id || '').replace(/'/g, "\\'");
var delBtn = (m.text !== "[DELETED_FOR_EVERYONE]") ? '<span onclick="event.stopPropagation(); deleteForEveryone(\'' + phone + '\', \'' + safeMsgId + '\')" style="margin-left:6px; cursor:pointer; font-size:12px; opacity:0.5; color:#ea4335;" title="Delete for everyone">🗑️</span>' : '';

html+='<div class="msg-bubble '+cls+'" ondblclick="setReplyTarget(\'' + safeSender + '\', \'' + cleanText + '\', \'' + safeMsgId + '\')" oncontextmenu="openContextMenu(event, \'' + phone + '\', \'' + safeMsgId + '\', \'' + cleanText + '\', \'' + safeSender + '\')" ontouchstart="handleTouchStart(event, \'' + phone + '\', \'' + safeMsgId + '\', \'' + cleanText + '\', \'' + safeSender + '\')" ontouchend="handleTouchEnd()" ontouchmove="handleTouchEnd()">' +
        quotedHtml + content +
        '<div class="msg-time">' + time + statusTick +
          '<span onclick="event.stopPropagation(); setReplyTarget(\'' + safeSender + '\', \'' + cleanText + '\', \'' + safeMsgId + '\')" style="margin-left:6px; cursor:pointer; font-size:12px; opacity:0.6;" title="Reply">↩</span>' +
          delBtn +
        '</div>' +
      '</div>';
}
el.innerHTML=html+'<div style="clear:both"></div>';
if(!silent||wasAtBottom)el.scrollTop=el.scrollHeight;
});
}

var activeMenuMsg = null;
var touchTimer = null;

function handleTouchStart(e, phone, msgId, text, senderName) {
  touchTimer = setTimeout(function() {
    openContextMenu(e, phone, msgId, text, senderName);
  }, 500);
}

function handleTouchEnd() {
  if (touchTimer) clearTimeout(touchTimer);
}

function openContextMenu(e, phone, msgId, text, senderName) {
  if (e) {
    e.preventDefault();
    e.stopPropagation();
  }
  activeMenuMsg = { phone: phone, msgId: msgId, text: text, senderName: senderName };

  var menu = document.getElementById("contextMenu");
  if (!menu) return;
  menu.style.display = "block";

  var posX = e ? (e.clientX || (e.touches && e.touches[0] ? e.touches[0].clientX : 100)) : 100;
  var posY = e ? (e.clientY || (e.touches && e.touches[0] ? e.touches[0].clientY : 100)) : 100;

  if (posX + 200 > window.innerWidth) posX = window.innerWidth - 210;
  if (posY + 150 > window.innerHeight) posY = window.innerHeight - 160;

  menu.style.left = posX + "px";
  menu.style.top = posY + "px";
}

function hideContextMenu() {
  var menu = document.getElementById("contextMenu");
  if (menu) menu.style.display = "none";
}

document.addEventListener("click", hideContextMenu);
document.addEventListener("scroll", hideContextMenu, true);

function onMenuReply() {
  hideContextMenu();
  if (activeMenuMsg) {
    setReplyTarget(activeMenuMsg.senderName, activeMenuMsg.text, activeMenuMsg.msgId);
  }
}

function onMenuCopy() {
  hideContextMenu();
  if (activeMenuMsg && activeMenuMsg.text) {
    navigator.clipboard.writeText(activeMenuMsg.text);
  }
}

function onMenuDeleteForEveryone() {
  hideContextMenu();
  if (activeMenuMsg && activeMenuMsg.phone && activeMenuMsg.msgId) {
    deleteForEveryone(activeMenuMsg.phone, activeMenuMsg.msgId);
  }
}

function deleteForEveryone(phone, msgId) {
  if (!msgId) return;
  if (!confirm("Delete this message for everyone on WhatsApp?")) return;
  api("/api/delete-message", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ phone: phone, msgId: msgId })
  }).then(function(r) { return r.json(); }).then(function(data) {
    if (data.success) {
      loadMessages(phone, true);
    } else {
      alert("Failed to delete message: " + (data.error || "Unknown error"));
    }
  });
}

var isViewOnce = false;

function toggleViewOnce() {
  isViewOnce = !isViewOnce;
  var btn = document.getElementById("viewOnceBtn");
  if (!btn) return;
  if (isViewOnce) {
    btn.style.background = "#00a884";
    btn.style.color = "#fff";
    btn.style.borderColor = "#00a884";
    btn.textContent = "1️⃣ View Once ON";
  } else {
    btn.style.background = "transparent";
    btn.style.color = "#8696a0";
    btn.style.borderColor = "#374045";
    btn.textContent = "1️⃣ Off";
  }
}

function sendMedia(e){
var file = e.target.files[0];
if(!file || !currentPhone) return;
document.getElementById('mediaFile').value = ""; // reset
var fd = new FormData();
fd.append("phone", currentPhone);
fd.append("file", file, file.name || "image.jpg");
fd.append("isViewOnce", isViewOnce ? "true" : "false");

var input = document.getElementById("msgInput");
var oldPlaceholder = input.placeholder;
input.placeholder = isViewOnce ? "Sending View Once media..." : "Sending image...";

api("/api/send-media", { method: "POST", body: fd })
.then(function(r){
  if (!r.ok) return r.json().then(function(err){ throw new Error(err.error || "Failed to send image"); });
  return r.json();
})
.then(function(){
  input.placeholder = oldPlaceholder;
  if (isViewOnce) toggleViewOnce(); // reset toggle
  loadMessages(currentPhone);
  setTimeout(function(){loadConversations()},500);
}).catch(function(err){
  input.placeholder = oldPlaceholder;
  alert("Image Send Error: " + (err.message || "Failed to send image"));
});
}

var currentReply = null;

function setReplyTarget(name, text, msgId) {
  currentReply = { name: name, text: text, msgId: msgId };
  document.getElementById("replySender").textContent = "Replying to " + name;
  document.getElementById("replyPreviewText").textContent = text.length > 50 ? text.substring(0, 50) + "..." : text;
  document.getElementById("replyPreviewBar").style.display = "block";
  document.getElementById("msgInput").focus();
}

function cancelReply() {
  currentReply = null;
  document.getElementById("replyPreviewBar").style.display = "none";
}

function sendMsg(){
var input=document.getElementById("msgInput");
var msg=input.value.trim();
if(!msg||!currentPhone)return;

var payload = { phone: currentPhone, message: msg };
if (currentReply) {
  payload.quoted = currentReply;
}

input.value="";
cancelReply();

api("/api/send",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(payload)
}).then(function(r){return r.json()}).then(function(){
loadMessages(currentPhone);
setTimeout(function(){loadConversations()},500);
});
}

function deleteChat(){
if(!currentPhone)return;
if(!confirm("Delete this chat and reset auto-reply?"))return;
api("/api/customer/"+currentPhone,{method:"DELETE"}).then(function(){
goBackToLobby();
loadConversations();
});
}

function revealMedia(box, phone, msgId, mediaId) {
  var img = box.querySelector(".media-img");
  var overlay = box.querySelector(".media-overlay");
  if (!img) return;

  if (img.style.filter === "none") {
    return; // Already un-blurred
  }

  img.style.filter = "none";
  if (overlay) overlay.style.display = "none";

  if (box.blurTimer) clearTimeout(box.blurTimer);
  box.blurTimer = setTimeout(function() {
    if (phone && (msgId || mediaId)) {
      api("/api/expire-message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone, msgId: msgId, mediaId: mediaId })
      }).then(function() {
        loadMessages(phone, true);
      });
    }
  }, 60 * 1000);
}

// SETTINGS
function openSettings(){
document.getElementById("settingsScreen").classList.add("open");
}
function closeSettings(){
document.getElementById("settingsScreen").classList.remove("open");
}

function loadProfile(){
api("/api/profile").then(function(r){return r.json()}).then(function(data){
if(data.profile_picture_url)document.getElementById("dpPreview").src=data.profile_picture_url;
if(data.about)document.getElementById("profileAbout").value=data.about;
if(data.description)document.getElementById("profileDesc").value=data.description;
}).catch(function(){});
}

function loadAutoReply(){
api("/api/auto-reply").then(function(r){return r.json()}).then(function(data){
document.getElementById("autoReplyMsg").value=data.message||"";
});
}

function updateProfile(){
var about=document.getElementById("profileAbout").value;
var desc=document.getElementById("profileDesc").value;
api("/api/profile",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({about:about,description:desc})
}).then(function(r){return r.json()}).then(function(data){
if(data.success)showStatus("profileStatus","Profile saved!","success");
else showStatus("profileStatus",data.error||"Failed","error");
});
}

function updateAutoReply(){
var msg=document.getElementById("autoReplyMsg").value;
api("/api/auto-reply",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:msg})
}).then(function(r){return r.json()}).then(function(data){
if(data.success)showStatus("arStatus","Auto-reply saved!","success");
else showStatus("arStatus","Failed","error");
});
}

function showStatus(id,msg,type){
var el=document.getElementById(id);
el.textContent=msg;
el.className="status-msg "+type;
setTimeout(function(){el.className="status-msg"},3000);
}

// CROPPER
function openCropModal(e){
var file=e.target.files[0];
if(!file)return;
var url=URL.createObjectURL(file);
document.getElementById("cropImage").src=url;
document.getElementById("cropModal").classList.add("open");
setTimeout(function(){
if(cropper)cropper.destroy();
cropper=new Cropper(document.getElementById("cropImage"),{
aspectRatio:1,viewMode:1,dragMode:"move",background:false,autoCropArea:0.8
});
},300);
}

function closeCrop(){
document.getElementById("cropModal").classList.remove("open");
document.getElementById("dpFile").value="";
if(cropper){cropper.destroy();cropper=null;}
}

function applyCrop(){
if(!cropper)return;
cropper.getCroppedCanvas({width:500,height:500}).toBlob(function(blob){
closeCrop();
var fd=new FormData();
fd.append("photo",blob,"dp.jpg");
showStatus("dpStatus","Uploading...","success");
api("/api/profile/picture",{method:"POST",body:fd})
.then(function(r){return r.json()}).then(function(data){
if(data.success){showStatus("dpStatus","DP Updated!","success");loadProfile();}
else showStatus("dpStatus",data.error||"Failed","error");
}).catch(function(){showStatus("dpStatus","Upload failed","error");});
},"image/jpeg",0.9);
}
</script>
